<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>European Power Intel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1220;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    main {
      width: 90%;
      max-width: 720px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      margin-bottom: 1rem;
    }

    .status {
      display: inline-block;
      margin-bottom: 2rem;
      padding: 0.45rem 0.8rem;
      border: 1px solid #334155;
      border-radius: 999px;
      color: #94a3b8;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    p {
      color: #cbd5e1;
      font-size: 1.15rem;
      line-height: 1.6;
    }

    .accent {
      width: 48px;
      height: 3px;
      margin: 2rem auto;
      background: #38bdf8;
      border-radius: 3px;
    }

    footer {
      margin-top: 3rem;
      color: #64748b;
      font-size: 0.8rem;
    }
  </style>
</head>

<body>
  <main>
    <div class="status">Major update in progress</div>

    <h1>European Power Intel</h1>

    <div class="accent"></div>

    <p>
      The site is temporarily offline while a major update is completed.
      <br>
      We'll be back soon.
    </p>

    <footer>
      European power market data &amp; analytics
    </footer>
  </main>
</body>
</html>
