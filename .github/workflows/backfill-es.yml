name: Backfill Spain history (one-off)
# Start by hand from the Actions tab. Downloads Spain's demand, generation
# mix and real-time exchanges from ESIOS (REE), and Portugal's prices and the
# Spain-Portugal flows from ENTSO-E, from 2015. About 2,500 requests, spaced
# out, so it takes one to two hours. The regular updates keep running; only
# the final save step waits its turn. Safe to re-run: stored data is merged.
on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "Comma-separated: demand, mix, exchanges, prices, flows"
        required: true
        default: "demand,mix,exchanges,prices,flows"
      first_year:
        description: "First year to fetch"
        required: true
        default: "2015"
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download Spain history
        env:
          ESIOS_API_KEY: ${{ secrets.ESIOS_API_KEY }}
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python scripts/es_backfill.py --datasets "${{ inputs.datasets }}" --first-year "${{ inputs.first_year }}"
      - uses: actions/upload-artifact@v4
        with:
          name: spain-data
          path: |
            data/es
            data/prices/PT
          retention-days: 7
  save:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: rte-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: spain-data
          path: data
      - name: Build Spain summaries
        run: python scripts/es_summarise.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/es data/prices/PT
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -qm "Backfill Spain history"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            sleep 15
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
