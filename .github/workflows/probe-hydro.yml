name: Hydro probe (one-off)
# Start by hand from the Actions tab. Finds the data behind MITECO's ArcGIS
# dashboard of the weekly Boletin Hidrologico and saves a report to
# probe/out/. Read-only for data/. Takes a minute or two. Safe to re-run.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the hydro probe
        run: python scripts/hydro_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydro-probe
          path: probe/out
          retention-days: 14
      - name: Save the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/out
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -qm "Hydro probe report"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            sleep 15
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
