<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>European Power Intelligence</title>
  <meta name="description" content="European power market data from the national grid operators and ENTSO-E: demand and forecasts, day-ahead prices, generation by fuel and cross-border flows for France and Spain, compared with earlier years.">
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="European Power Intelligence">
  <meta property="og:title" content="European Power Intelligence">
  <meta property="og:description" content="Demand, day-ahead prices, generation and cross-border flows for European power markets, from grid operator and ENTSO-E data.">
  <meta property="og:url" content="https://jms-drn.github.io/euro_power_intel/">
  <meta property="og:image" content="https://jms-drn.github.io/euro_power_intel/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://jms-drn.github.io/euro_power_intel/og-image.png">
  <script>
    // Apply the saved theme and sidebar width before anything draws, to avoid a flash.
    // With no address (or #home) the minimal home page is shown, so the sidebar
    // and top bar are hidden from the start.
    try {
      const saved = JSON.parse(localStorage.getItem("display") || "{}");
      const theme = saved.theme || localStorage.getItem("theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      if (localStorage.getItem("sidebar") === "collapsed") document.documentElement.dataset.sidebar = "collapsed";
      if (!location.hash || location.hash === "#home") document.documentElement.dataset.view = "home";
    } catch (error) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="js/vendor/echarts.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Site navigation">
      <a class="side-brand" href="#home" title="European Power Intelligence: all markets">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="side-brand-text"><b>European Power <em>Intel</em></b><span class="byline">by jms-drn</span></span>
      </a>
      <nav class="side-nav"></nav>
      <div class="side-pins" id="side-pins" hidden></div>
      <div class="side-foot">
        <button class="side-link" type="button" id="whats-new" title="What's new">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
          <span>What's new</span><span class="new-dot" hidden></span>
        </button>
        <button class="side-link" type="button" data-open="about" title="About the data">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
          <span>About the data</span>
        </button>
        <a class="side-link" href="https://github.com/jms-drn" target="_blank" rel="noopener" title="Other projects">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
          <span>Other projects</span>
        </a>
        <button class="side-link collapse" type="button" id="collapse" title="Collapse the sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          <span>Collapse</span>
        </button>
      </div>
    </aside>
    <div class="sidebar-scrim" hidden></div>
    <div class="main-col">
      <header class="site-header">
        <div class="shell">
          <div class="header-row">
            <div class="title-wrap">
              <button class="menu-button" id="menu-button" type="button" aria-label="Open navigation" aria-controls="sidebar">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              </button>
              <a class="brand" id="page-brand" href="#home">
                <span class="brand-text">
                  <span class="brand-name" id="page-title">European Power <em>Intel</em></span>
                  <span class="byline">by jms-drn</span>
                </span>
              </a>
            </div>
            <div class="header-actions">
              <span class="status-pill" id="status-pill" title="Time of the latest data (Paris time)">
                <span id="status-dot" class="status-dot"></span>
                <span id="status-text" class="status-text">Loading…</span>
              </span>
              <div class="menu">
                <button id="bell" class="btn ghost bell" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="bell-panel" title="Notable events">
                  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 2h-15l1.5-2ZM10 20.5a2.2 2.2 0 0 0 4 0"/></svg>
                  <span class="bell-count" hidden>0</span>
                </button>
                <div id="bell-panel" class="popover bell-panel" hidden></div>
              </div>
              <button id="refresh" class="btn" type="button" title="Get the latest data">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"/></svg>
                <span>Refresh</span>
              </button>
              <div class="menu">
                <button id="display-button" class="btn ghost" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="display-menu">Display <span aria-hidden="true">▾</span></button>
                <div id="display-menu" class="popover" hidden></div>
              </div>
            </div>
          </div>
          <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
        </div>
      </header>
      <main class="shell" id="views">
        <footer></footer>
      </main>
    </div>
  </div>
  <div class="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
    <div class="drawer-head">
      <h2 id="drawer-title"></h2>
      <button class="btn ghost" type="button" data-close aria-label="Close">Close</button>
    </div>
    <div class="drawer-body"></div>
  </aside>
  <script type="module" src="js/main.js"></script>
</body>
</html>
